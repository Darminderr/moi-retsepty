<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Мои рецепты — 30 проверенных рецептов, план на неделю, список покупок и режим готовки с таймером.">
<title>Мои рецепты</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
  /* Если CDN недоступен, подхватываем локальную копию VK Bridge */
  if (!window.vkBridge) { document.write('<script src="assets/vk-bridge.js"><\/script>'); }
</script>
<script>
  /* VK Bridge инициализируется сразу, до отрисовки интерфейса */
  (function () {
    try {
      var inVK = !!(window.AndroidBridge ||
        (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.VKWebAppClose) ||
        (window.parent && window.parent !== window) ||
        /vk_app_id=|vk_platform=/.test(location.search));
      if (window.vkBridge && typeof window.vkBridge.send === 'function') {
        window.vkBridge.send('VKWebAppInit', {});
        window.__VK = inVK;
      } else {
        window.__VK = false;
      }
    } catch (e) {
      window.__VK = false;
    }
  })();
</script>
</head>
<body>

<!-- Иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.9a5.2 5.2 0 00-7.4 0L12 7.3l-1.4-1.4a5.2 5.2 0 10-7.4 7.4L12 22l8.8-8.7a5.2 5.2 0 000-7.4z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 13v6a1 1 0 001 1h14a1 1 0 001-1v-6"/><path d="M16 7l-4-4-4 4"/><path d="M12 3v13"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 001 .8h8.9a1 1 0 001-.8L20 7H6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fridge" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M6 10h12M9.5 6.5v2M9.5 13.5v2"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9L3.5 9.7l5.9-.8L12 3.5z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4L5.2 18.8"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13.5h9L17.5 7M10 11v6M14 11v6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8 10V7.5a4 4 0 018 0V10"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.9"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8l12 7.2-12 7.2V4.8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v4h-4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="3"/><path d="M15.5 5.5a3 3 0 00-3-3h-6a3 3 0 00-3 3v6a3 3 0 003 3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v15.5H6.5A2.5 2.5 0 004 21V5.5z"/><path d="M4 18.5A2.5 2.5 0 016.5 16H19"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 01-.6-9A6 6 0 0118 10.4a3.8 3.8 0 01.3 7.5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.5 3.5-3 5-3 8a3 3 0 006 0c0-1.2-.5-2-1-2.8 3 1 5 3.3 5 6.3a7 7 0 11-14 0c0-4 4-6.5 7-11.5z"/></symbol>
    <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3.5 11h17a8.5 8.5 0 01-17 0z"/><path d="M8.5 7.5c0-1.5 1.5-1.5 1.5-3M13 7.5c0-1.5 1.5-1.5 1.5-3"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></symbol>
  </defs>
</svg>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<!-- ===== Главная ===== -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div class="grow">
      <h1 id="home-title">Мои рецепты</h1>
      <div class="sub" id="home-sub">30 рецептов · план · покупки</div>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Сменить тему" id="theme-btn"></button>
  </div>
  <div class="page">
    <div class="hero">
      <h2>Что приготовим сегодня?</h2>
      <p>Проверенные рецепты с точными граммовками, план на неделю и список покупок.</p>
      <div class="hero-actions">
        <button class="hero-btn" onclick="randomRecipe()"><svg class="ic ic-sm"><use href="#i-dice"/></svg> Удивить меня</button>
        <button class="hero-btn ghost" onclick="openFridge()"><svg class="ic ic-sm"><use href="#i-fridge"/></svg> Что в холодильнике</button>
      </div>
    </div>
    <div class="quick" id="quick-actions"></div>
    <div class="seg" id="home-seg">
      <button class="on" data-tab="all">Все рецепты</button>
      <button data-tab="my">Мои</button>
      <button data-tab="fav">Избранное</button>
    </div>
    <div class="search">
      <svg class="ic ic-sm"><use href="#i-search"/></svg>
      <input id="home-q" placeholder="Найти блюдо или ингредиент" oninput="renderHome()" autocomplete="off">
    </div>
    <div class="chips" id="home-chips"></div>
    <div id="home-list" class="cards"></div>
  </div>
</div>

<!-- ===== План ===== -->
<div class="screen" id="screen-plan">
  <div class="topbar">
    <div class="grow"><h1>План на неделю</h1><div class="sub" id="plan-sub">Соберите меню заранее</div></div>
    <button class="icon-btn" onclick="autoPlan()" aria-label="Заполнить план"><svg class="ic"><use href="#i-sparkle"/></svg></button>
  </div>
  <div class="page"><div id="plan-list"></div><div id="plan-actions" class="mt16"></div></div>
</div>

<!-- ===== Покупки ===== -->
<div class="screen" id="screen-shop">
  <div class="topbar">
    <div class="grow"><h1>Список покупок</h1><div class="sub" id="shop-sub">0 позиций</div></div>
    <button class="icon-btn" onclick="addShopManually()" aria-label="Добавить"><svg class="ic"><use href="#i-plus"/></svg></button>
  </div>
  <div class="page"><div id="shop-list"></div><div class="shop-summary hidden" id="shop-summary"><span id="shop-left"></span><span id="shop-done"></span></div><div id="shop-actions"></div></div>
</div>

<!-- ===== Профиль ===== -->
<div class="screen" id="screen-profile">
  <div class="topbar solid"><div class="grow"><h1>Профиль</h1><div class="sub">Безлимит и настройки</div></div></div>
  <div class="page" id="profile-body"></div>
</div>

<!-- ===== Служебные экраны (рендерятся из JS) ===== -->
<div class="screen" id="screen-detail"><div id="detail-body"></div></div>
<div class="screen" id="screen-cook"><div id="cook-body"></div></div>
<div class="screen" id="screen-add"><div id="add-body"></div></div>
<div class="screen" id="screen-converter"><div id="converter-body"></div></div>
<div class="screen" id="screen-fridge"><div id="fridge-body"></div></div>
<div class="screen" id="screen-subs"><div id="subs-body"></div></div>

<!-- ===== Нижняя навигация ===== -->
<nav class="tabbar" id="tabbar">
  <button id="tab-home" class="on" onclick="go('home')"><svg class="ic"><use href="#i-bowl"/></svg>Рецепты</button>
  <button id="tab-plan" onclick="go('plan')"><svg class="ic"><use href="#i-calendar"/></svg>План</button>
  <button class="tab-add" onclick="openAdd()" aria-label="Добавить рецепт"><svg class="ic"><use href="#i-plus"/></svg></button>
  <button id="tab-shop" onclick="go('shop')"><svg class="ic"><use href="#i-cart"/></svg>Покупки</button>
  <button id="tab-profile" onclick="go('profile')"><svg class="ic"><use href="#i-user"/></svg>Профиль</button>
</nav>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
